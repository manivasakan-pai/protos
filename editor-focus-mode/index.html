<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor focus mode</title>
<style>
:root{
  --surface:#FFFFFF;--canvas:#F5F5F5;--sunken:#F5F5F5;--line:#E6E6E6;--ink:26 26 26;--ink2:#7F7F7F;--ink3:#B2B2B2;
  --brand:#0D99FF;--brand-hover:#007BE5;--brand-fg:#007BE5;--tint:#E5F4FF;--edge:rgb(var(--ink)/.3);
  --shadow-menu:0 1px 2px 0 rgb(0 0 0/.06),0 8px 24px -6px rgb(0 0 0/.16);
  --top:56px;--rail:208px;--ease:cubic-bezier(.2,0,0,1);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --surface:#2C2C2C;--canvas:#1E1E1E;--sunken:#383838;--line:#444444;--ink:255 255 255;--ink2:#BFBFBF;--ink3:#808080;
  --brand:#0C8CE9;--brand-hover:#0A6DC2;--brand-fg:#7CC4F8;--tint:#394360;
  --shadow-menu:0 1px 2px 0 rgb(0 0 0/.3),0 8px 24px -6px rgb(0 0 0/.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--canvas);color:rgb(var(--ink));font:14px/20px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:16px;height:16px}
.ib{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:6px;color:var(--ink2);transition:background .15s,color .15s}
.ib:hover{background:var(--sunken);color:rgb(var(--ink))}
.ib.on{background:var(--tint);color:var(--brand-fg)}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:6px;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:has(>svg:first-child){padding-left:12px}
.btn.sec{background:var(--surface);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--edge);background:var(--sunken)}
.btn.pri{background:var(--brand);color:#fff;box-shadow:0 1px 2px rgb(0 0 0/.1)}
.btn.pri:hover{background:var(--brand-hover)}

/* Top bar: docked, or an overlay that slides down in focus mode */
#topbar{position:fixed;left:0;right:0;top:0;height:var(--top);z-index:47;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--surface);border-bottom:1px solid var(--line);transition:top .2s var(--ease),box-shadow .2s}
.focus #topbar{top:calc(-1 * var(--top) - 8px)}
.focus.peek-top #topbar{top:0;box-shadow:var(--shadow-menu)}
#title{min-width:0;max-width:340px;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;padding:0 8px;height:36px;line-height:36px;border-radius:6px}
#title:hover{background:var(--sunken)}
.saved{color:var(--ink2);font-size:12px;white-space:nowrap}
.grow{flex:1}
@media (max-width:860px){.saved,.hide-sm{display:none}}

/* Slide rail */
#rail{position:fixed;left:0;top:var(--top);bottom:0;width:var(--rail);z-index:9;display:flex;flex-direction:column;background:var(--canvas);transition:left .2s var(--ease),top .2s var(--ease),box-shadow .2s}
.focus #rail{top:0;left:calc(-1 * var(--rail) - 8px);z-index:46;border-right:1px solid var(--line)}
.focus.peek-rail #rail{left:0;box-shadow:var(--shadow-menu)}
.focus.peek-top #rail{top:var(--top)}
#rail .newslide{margin:12px 12px 8px;justify-content:center}
#thumbs{list-style:none;margin:0;padding:4px 12px 16px 8px;overflow-y:auto;flex:1}
#thumbs li{display:flex;gap:6px;align-items:flex-start;margin-bottom:10px}
#thumbs .n{width:16px;text-align:right;font-size:12px;color:var(--ink2);padding-top:2px;font-variant-numeric:tabular-nums}
#thumbs li.on .n{color:var(--brand-fg);font-weight:600}
.tframe{position:relative;flex:1;aspect-ratio:16/9;border-radius:6px;overflow:hidden;outline:1px solid var(--line);background:#fff;cursor:pointer}
#thumbs li.on .tframe{outline:2px solid var(--brand);outline-offset:1px}
.tframe .slide{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}

/* Canvas */
#canvas{position:fixed;left:var(--rail);top:var(--top);right:0;bottom:0;transition:left .2s var(--ease),top .2s var(--ease)}
.focus #canvas{left:0;top:0}
#frame{position:absolute;border-radius:4px;box-shadow:0 0 0 1px var(--line),0 1px 3px rgb(0 0 0/.06);overflow:hidden;background:#fff;transition:left .2s var(--ease),top .2s var(--ease),width .2s var(--ease),height .2s var(--ease)}
#frame .slide{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .2s var(--ease)}

/* Floating pills */
.pill{position:absolute;display:flex;align-items:center;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-menu);white-space:nowrap}
.pill .div{width:1px;height:24px;background:var(--line);margin:0 2px}
.tile{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:6px;color:rgb(var(--ink));transition:background .15s}
.tile:hover{background:var(--sunken)}
.tile.icon{width:36px;padding:0;justify-content:center}
.tile b{font-weight:700}.tile i{font-style:italic;font-family:Georgia,serif}.tile u{text-decoration:underline}
#bottombar{transform:translateX(-50%);transition:left .2s var(--ease),top .2s var(--ease)}
#slot{transform:translateX(-50%);top:8px;opacity:0;pointer-events:none;transition:opacity .15s,left .2s var(--ease)}
#slot.show{opacity:1;pointer-events:auto}
.ctl{display:inline-flex;align-items:center;height:36px;border:1px solid var(--line);border-radius:6px;transition:border-color .15s}
.ctl:hover{border-color:var(--edge)}
.ctl .a{display:inline-flex;align-items:center;gap:8px;padding:0 10px;height:100%}
.ctl .c{display:inline-flex;align-items:center;justify-content:center;width:32px;height:100%;border-left:1px solid var(--line)}
.ctl.step{padding:2px;gap:0}
.ctl.step button{width:30px;height:30px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.ctl.step button:hover{background:var(--sunken)}
.ctl.step span{width:34px;text-align:center;font-variant-numeric:tabular-nums}
.dot{width:16px;height:16px;border-radius:50%;background:#1B1F3B;box-shadow:inset 0 0 0 1px rgb(255 255 255/.4)}
#focuspill{left:8px;top:8px;display:none;z-index:41}
.focus #focuspill{display:flex}
#corner{right:12px;bottom:12px;z-index:41}

/* Tooltip */
[data-tip]{position:relative}
#tip{position:fixed;z-index:80;pointer-events:none;background:#1E1E1E;color:#fff;font-size:12px;line-height:16px;font-weight:500;padding:4px 8px;border-radius:6px;box-shadow:var(--shadow-menu);opacity:0;transition:opacity .12s;white-space:nowrap}
#tip.show{opacity:1}

/* Hint */
#hint{position:fixed;left:16px;bottom:16px;z-index:60;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-menu);padding:12px 14px 12px 14px;display:flex;gap:10px;align-items:flex-start;transition:opacity .25s,transform .25s}
#hint.hide{opacity:0;transform:translateY(8px);pointer-events:none}
#hint p{margin:0;font-size:13px;line-height:18px;color:var(--ink2)}
#hint strong{display:block;color:rgb(var(--ink));font-size:13px;margin-bottom:2px}
kbd{font:500 11px/16px system-ui,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface);color:rgb(var(--ink))}

/* Slides (1280 x 720, scaled). The slide keeps its own colours in both themes */
.slide{width:1280px;height:720px;background:#fff;color:#1B1F3B;font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden}
.slide .t{cursor:text;border-radius:2px}
#frame .slide .t:hover{outline:1px solid rgb(13 153 255/.5)}
#frame .slide .t.sel{outline:2px solid #0D99FF;outline-offset:2px}
.y{background:#FFD84D}.nv{background:#1B1F3B;color:#fff}
.k{font-size:20px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:#5B6080}
.h{font-size:58px;line-height:1.08;font-weight:800;letter-spacing:-.02em;margin:0}
.h2{font-size:46px;line-height:1.12;font-weight:800;letter-spacing:-.015em;margin:0}
.p{font-size:24px;line-height:1.45;color:#3B4060;margin:0}
</style>
</head>
<body>
<div id="app" class="focus">
  <header id="topbar">
    <button class="ib" data-tip="Home" aria-label="Home" data-icon="HomeIcon"></button>
    <div id="title" title="Rename">Q3 OKR performance and year-end priorities</div>
    <span class="saved">Saved</span>
    <div class="grow"></div>
    <button class="ib hide-sm" data-tip="Undo" aria-label="Undo" data-icon="ArrowUturnLeftIcon"></button>
    <button class="ib hide-sm" data-tip="Redo" aria-label="Redo" data-icon="ArrowUturnRightIcon"></button>
    <button class="ib" id="themebtn" data-tip="Dark mode" aria-label="Dark mode" data-icon="MoonIcon"></button>
    <button class="ib" data-tip="More actions" aria-label="More actions" data-icon="EllipsisHorizontalIcon"></button>
    <button class="btn sec"><svg class="i s" data-path="ShareIcon"></svg>Share</button>
    <button class="btn sec hide-sm"><svg class="i s" data-path="PlayIcon"></svg>Present</button>
    <button class="btn pri"><svg class="i s" data-path="ArrowDownTrayIcon"></svg>Export as PPT</button>
  </header>

  <aside id="rail" aria-label="Slides">
    <button class="btn sec newslide"><svg class="i s" data-path="PlusIcon"></svg>New slide</button>
    <ol id="thumbs"></ol>
  </aside>

  <main id="canvas">
    <div id="slot" class="pill" role="toolbar" aria-label="Text">
      <span class="ctl"><span class="a"><b style="font-weight:500">Aa</b> Extra large</span><span class="c"><svg class="i s" data-path="ChevronDownIcon"></svg></span></span>
      <span class="ctl step" style="margin-left:4px"><button aria-label="Smaller"><svg class="i s" data-path="MinusIcon"></svg></button><span id="fs">80</span><button aria-label="Bigger"><svg class="i s" data-path="PlusIcon"></svg></button></span>
      <span class="div"></span>
      <button class="tile icon" data-tip="Bold"><b>B</b></button>
      <button class="tile icon" data-tip="Italic"><i>I</i></button>
      <button class="tile icon" data-tip="Underline"><u>U</u></button>
      <span class="div"></span>
      <button class="tile icon" data-tip="Text colour"><span class="dot"></span></button>
      <button class="tile icon" data-tip="Edit with AI"><svg class="i" data-path="SparklesIcon"></svg></button>
      <button class="tile icon" data-tip="More"><svg class="i" data-path="EllipsisHorizontalIcon"></svg></button>
    </div>

    <div id="frame"></div>

    <div id="bottombar" class="pill" role="toolbar" aria-label="Slide">
      <button class="tile"><svg class="i" data-path="PlusIcon"></svg>Insert</button>
      <button class="tile"><svg class="i" data-path="SwatchIcon"></svg>Style</button>
      <button class="tile"><svg class="i" data-path="SparklesIcon" style="color:var(--brand)"></svg>Edit with AI</button>
      <span class="div"></span>
      <button class="tile icon" data-tip="More"><svg class="i" data-path="EllipsisVerticalIcon"></svg></button>
    </div>

    <div id="focuspill" class="pill" data-focus-controls>
      <button class="ib" id="menubtn" data-tip="Menu" aria-label="Menu" data-icon="Bars3Icon"></button>
      <button class="ib" id="slidesbtn" data-tip="Slides" aria-label="Slides" data-icon="RectangleStackIcon"></button>
    </div>

    <div id="corner" class="pill" data-focus-controls style="padding:2px;border-radius:12px">
      <button class="ib" id="focusbtn" aria-label="Exit focus mode"></button>
    </div>
  </main>
</div>

<div id="hint" role="status">
  <div>
    <strong>Focus mode is on</strong>
    <p>The slide takes the whole window. <b>Menu</b> and <b>Slides</b> at the top left open the bars. <kbd id="k1">Ctrl</kbd> <kbd>\</kbd> or the corner button turns it off. Click any text to see its toolbar.</p>
  </div>
  <button class="ib" id="hintx" aria-label="Close" style="width:28px;height:28px;margin:-4px -6px 0 0" data-icon="XMarkIcon"></button>
</div>
<div id="tip"></div>

    <div style="position:absolute;top:-14px;bottom:8px;left:calc(274px + (100% - 368px) * .7/1.2);border-left:3px dashed #2E6BFF"></div>
    <div class="t" style="position:absolute;top:-44px;left:calc(262px + (100% - 368px) * .7/1.2);font-size:18px;color:#2E6BFF;font-weight:700">Target 0.70</div>
  </div>
</div>`,
`<div class="slide nv" style="padding:72px 80px">
  <div class="k t" style="color:#9CA1C4">What could move the number</div>
  <h2 class="h2 t" style="margin-top:16px;color:#fff">Three risks to the year-end number</h2>
  <div style="display:flex;gap:24px;margin-top:60px">
    ${[["Enterprise deals slip a quarter","Six of the top twelve deals have no signed order form yet."],["The platform migration needs two more sprints","Two teams share one on-call rota, so feature work waits."],["Data hiring is behind","Three open roles, and every week costs us a dashboard."]].map(([h,p],i)=>`<div style="flex:1;border-radius:20px;padding:34px;background:#272C52"><div style="width:52px;height:52px;border-radius:14px;background:${["#FFD84D","#FF7A59","#7FB2FF"][i]};color:#1B1F3B;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px">${i+1}</div><div class="t" style="font-size:28px;font-weight:700;margin-top:26px;line-height:1.2">${h}</div><div class="t" style="font-size:21px;color:#C9CCE0;margin-top:14px;line-height:1.45">${p}</div></div>`).join("")}
  </div>
</div>`,
`<div class="slide" style="padding:72px 80px;display:flex;gap:56px">
  <div style="width:42%">
    <div class="k t">Pipeline</div>
    <h2 class="h2 t" style="margin-top:16px">Pipeline covers 2.4× of Q4, short of the 3× we need</h2>
    <p class="p t" style="margin-top:28px">December carries the gap. Two late deals moved from November, and one is waiting on legal.</p>
  </div>
  <div style="flex:1;display:flex;align-items:flex-end;gap:36px;padding-bottom:40px;position:relative">
    ${[["Oct",2.9],["Nov",2.6],["Dec",1.7]].map(([m,v])=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:14px"><div class="t" style="font-size:30px;font-weight:800">${v}×</div><div style="width:100%;height:${v*150}px;border-radius:12px 12px 4px 4px;background:${v>=2.5?"#1B1F3B":"#FFD84D"}"></div><div class="t" style="font-size:22px;color:#5B6080;font-weight:600">${m}</div></div>`).join("")}
    <div style="position:absolute;left:0;right:0;bottom:${40+48+3*150}px;border-top:3px dashed #2E6BFF"></div>
    <div class="t" style="position:absolute;right:0;bottom:${40+56+3*150}px;font-size:18px;color:#2E6BFF;font-weight:700">Need 3×</div>
  </div>
</div>`,
`<div class="slide" style="padding:72px 80px">
  <div class="k t">The plan</div>
  <h2 class="h2 t" style="margin-top:16px">Four moves for Q4</h2>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:26px 40px;margin-top:52px">
    ${["Move two engineers onto the platform migration until it ships","Put an exec sponsor on each of the top twelve deals","Pause the two projects with the lowest score per hour","Fill the three data roles by 15 December"].map((t,i)=>`<div style="display:flex;gap:24px;align-items:flex-start;border-top:3px solid #1B1F3B;padding-top:22px"><div class="t" style="font-size:44px;font-weight:800;color:#2E6BFF;line-height:1">0${i+1}</div><div class="t" style="font-size:27px;font-weight:600;line-height:1.3">${t}</div></div>`).join("")}
  </div>
</div>`,
`<div class="slide y" style="padding:72px 80px">
  <div class="k t" style="color:#1B1F3B">Decisions</div>
  <h2 class="h2 t" style="margin-top:16px">What we need from leadership today</h2>
  <div style="margin-top:56px;display:flex;flex-direction:column;gap:22px">
    ${["Approve moving two engineers to the migration","Name an exec sponsor for each top-twelve deal","Agree which two projects pause until January"].map((t)=>`<div style="display:flex;gap:22px;align-items:center;background:#fff;border-radius:16px;padding:26px 30px"><div style="width:44px;height:44px;border-radius:50%;background:#1B1F3B;color:#FFD84D;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800">✓</div><div class="t" style="font-size:28px;font-weight:600">${t}</div></div>`).join("")}
  </div>
</div>`,
`<div class="slide nv" style="padding:84px 80px;display:flex;flex-direction:column;justify-content:space-between">
  <div class="k t" style="color:#9CA1C4">Next review</div>
  <div>
    <h1 class="h t" style="font-size:96px;color:#fff">14 January</h1>
    <p class="p t" style="color:#C9CCE0;margin-top:20px;font-size:28px">We bring the Q4 score, the migration date and the new pipeline coverage.</p>
  </div>
  <div style="height:14px;width:220px;background:#FFD84D;border-radius:8px"></div>
</div>`,
];

const app = document.getElementById("app");
const frame = document.getElementById("frame");
const thumbs = document.getElementById("thumbs");
const slot = document.getElementById("slot");
const bottombar = document.getElementById("bottombar");
const focusbtn = document.getElementById("focusbtn");
let current = 0, selected = null;
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const KEY = isMac ? "⌘\\" : "Ctrl+\\";
document.getElementById("k1").textContent = isMac ? "⌘" : "Ctrl";

thumbs.innerHTML = SLIDES.map((s, i) => `<li data-i="${i}"><span class="n">${i + 1}</span><div class="tframe">${s}</div></li>`).join("");
thumbs.addEventListener("click", (e) => { const li = e.target.closest("li"); if (li) show(+li.dataset.i); });

function show(i) {
  current = Math.max(0, Math.min(SLIDES.length - 1, i));
  frame.innerHTML = SLIDES[current];
  thumbs.querySelectorAll("li").forEach((li, k) => li.classList.toggle("on", k === current));
  { const li = thumbs.children[current]; if (li.offsetTop < thumbs.scrollTop || li.offsetTop + li.offsetHeight > thumbs.scrollTop + thumbs.clientHeight) thumbs.scrollTop = li.offsetTop - 12; }
  deselect();
  layout();
}

/* Same numbers as the editor: canvas top padding 8, toolbar slot 46 + 8, bottom bar gap 12 + 46 + 12, side margins 16 */
function layout() {
  const focus = app.classList.contains("focus");
  const cw = innerWidth - (focus ? 0 : 208), ch = innerHeight - (focus ? 0 : 56);
  const top = 62, below = 70, side = 16;
  const scale = Math.max(0.1, Math.min((cw - side * 2) / 1280, (ch - top - below) / 720));
  const w = 1280 * scale, h = 720 * scale, left = (cw - w) / 2;
  Object.assign(frame.style, { left: left + "px", top: top + "px", width: w + "px", height: h + "px" });
  const sl = frame.querySelector(".slide"); if (sl) sl.style.transform = `scale(${scale})`;
  bottombar.style.left = cw / 2 + "px"; bottombar.style.top = top + h + 12 + "px";
  slot.style.left = cw / 2 + "px";
  thumbs.querySelectorAll(".tframe").forEach((f) => { const s = f.querySelector(".slide"); s.style.transform = `scale(${f.clientWidth / 1280})`; });
}

function setFocus(on) {
  app.classList.toggle("focus", on);
  app.classList.remove("peek-top", "peek-rail");
  focusbtn.innerHTML = svg(on ? "ArrowsPointingInIcon" : "ArrowsPointingOutIcon");
  focusbtn.setAttribute("aria-label", on ? "Exit focus mode" : "Focus mode");
  focusbtn.dataset.tip = (on ? "Exit focus mode " : "Focus mode ") + KEY;
  syncPills();
  layout();
}
function peek(which, on) {
  app.classList.toggle("peek-" + which, on);
  syncPills();
}
function syncPills() {
  document.getElementById("menubtn").classList.toggle("on", app.classList.contains("peek-top"));
  document.getElementById("slidesbtn").classList.toggle("on", app.classList.contains("peek-rail"));
}
document.getElementById("menubtn").onclick = () => peek("top", !app.classList.contains("peek-top"));
document.getElementById("slidesbtn").onclick = () => peek("rail", !app.classList.contains("peek-rail"));
focusbtn.onclick = () => setFocus(!app.classList.contains("focus"));

/* Text selection: the toolbar sits in its slot above the slide */
function deselect() { if (selected) selected.classList.remove("sel"); selected = null; slot.classList.remove("show"); }
frame.addEventListener("click", (e) => {
  const t = e.target.closest(".t");
  if (!t) return deselect();
  if (selected) selected.classList.remove("sel");
  selected = t; t.classList.add("sel"); slot.classList.add("show");
  document.getElementById("fs").textContent = Math.round(parseFloat(getComputedStyle(t).fontSize));
});
/* A click on the canvas closes the overlays */
document.getElementById("canvas").addEventListener("mousedown", (e) => {
  if (e.target.closest("[data-focus-controls]")) return;
  if (app.classList.contains("peek-top") || app.classList.contains("peek-rail")) { app.classList.remove("peek-top", "peek-rail"); syncPills(); }
  if (!e.target.closest("#frame") && !e.target.closest(".pill")) deselect();
});
addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && (e.key === "\\" || e.code === "Backslash")) { e.preventDefault(); setFocus(!app.classList.contains("focus")); return; }
  if (e.key === "Escape") { if (app.classList.contains("peek-top") || app.classList.contains("peek-rail")) { app.classList.remove("peek-top", "peek-rail"); syncPills(); } else deselect(); }
  if (["ArrowDown", "PageDown", "ArrowRight"].includes(e.key)) { e.preventDefault(); show(current + 1); }
  if (["ArrowUp", "PageUp", "ArrowLeft"].includes(e.key)) { e.preventDefault(); show(current - 1); }
});

/* Theme */
const themebtn = document.getElementById("themebtn");
themebtn.onclick = () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  themebtn.innerHTML = svg(dark ? "SunIcon" : "MoonIcon");
  themebtn.dataset.tip = dark ? "Light mode" : "Dark mode";
};

/* Tooltips */
const tip = document.getElementById("tip"); let tipT;
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]"); clearTimeout(tipT);
  if (!el) return tip.classList.remove("show");
  tipT = setTimeout(() => {
    tip.textContent = el.dataset.tip; const r = el.getBoundingClientRect();
    const below = r.top < 60; tip.style.top = (below ? r.bottom + 6 : r.top - 30) + "px";
    tip.style.left = Math.min(innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2)) + "px";
    tip.classList.add("show");
  }, 350);
});

/* Hint: closes itself after a while, or on X */
const hint = document.getElementById("hint");
document.getElementById("hintx").onclick = () => hint.classList.add("hide");
setTimeout(() => hint.classList.add("hide"), 12000);

addEventListener("resize", layout);
setFocus(true);
show(0);
</script>
</body>
</html>
